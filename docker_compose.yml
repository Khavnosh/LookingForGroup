version: '1.0'

services:
  #database service :o
  database:
    image: postgre:17-alpine
    container_name: lookingforgroup_pgdata
    port:
      - "5432"
    network:
      - internal
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-lookingforgroup_db}
    volumes: 
      - pgdata:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lookingforgroup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  #frontend service :o
  frontend:
    image: nginx:1.27-alpine
    container_name: lookingforgroup_pgdata
    ports:
      - "8080:80"
    networks:
      - external
      - internal
    depends_on:
      backend:
        condition: service_healthy
    
    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: lookingforgroup_backend
      ports:
        - "5000:5000"
      network:
        - internal
      environment:
        DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-secretpassword}@database:5432/${POSTGRES_DB:-lookingforgroup_db}
        PORT: 5000
      depends_on:
        database:
          condition: service_healthy

  volumes:
    pgdata:
      name: lookingforgroup_pgdata

    
  