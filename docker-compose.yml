services:
  # database service
  database:
    image: postgres:17-alpine
    container_name: lookingforgroup_db
    expose:
      - "5432"
    networks:
      - internal
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lookingforgroup_backend
    ports:
      - "5000:5000"
    networks:
      - internal
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lookingforgroup_frontend
    ports:
      - "8080:80"
    networks:
      - external
      - internal
    depends_on:
      backend:
        condition: service_healthy

  # adminer - only starts with: docker compose --profile tools up -d
  adminer:
    image: adminer:5
    container_name: lookingforgroup_adminer
    ports:
      - "8081:8080"
    networks:
      - external
      - internal
    profiles:
      - tools

# networks
networks:
  external:
  internal:
    internal: true

# docker named volume
volumes:
  pgdata:
    name: lookingforgroup_pgdata
